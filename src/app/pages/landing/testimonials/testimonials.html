<section id="testimonials" class="testimonials-section py-5">
  <div class="container">
    <div class="text-center mb-5 animate__animated animate__fadeIn">
      <h2 class="section-title">Client <span class="highlight">Testimonials</span></h2>
      <p class="section-subtitle">What others say about working with Hesham.</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-4 col-md-6" *ngFor="let item of testimonials">
        <div class="testimonial-card">
          <div class="quote-icon">
            <i class="bi bi-quote"></i>
          </div>

          <p class="testimonial-text">
            "{{ item.quote }}"
          </p>

          <div class="client-info">
            <!-- <div class="client-img">
              <img [src]="item.image" [alt]="item.name">
            </div> -->
            <div class="client-details">
              <h4 class="client-name">{{ item.name }}</h4>
              <p class="client-role">{{ item.role }}</p>
            </div>
          </div>

          <div class="card-glow"></div>
        </div>
      </div>
    </div>
  </div>
</section>
