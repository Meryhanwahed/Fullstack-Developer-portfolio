<section id="projects" class="projects-section py-5">
  <div class="container">
    <div class="text-center mb-5">
      <h2 class="section-title">Featured <span class="highlight">Projects</span></h2>
      <p class="section-subtitle">A showcase of my recent work and technical expertise.</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-4 col-md-6" *ngFor="let project of projects">
        <div class="project-card">
          <div class="project-img-container">
            <img [src]="project.image" [alt]="project.title" class="project-img">
            <div class="project-overlay">
              <div class="overlay-btns">
                <a [href]="project.liveDemo" target="_blank" class="btn btn-cyan btn-sm me-2">
                  <i class="bi bi-eye"></i> Live Demo
                </a>
                <a [href]="project.sourceCode" target="_blank" class="btn btn-outline-light btn-sm">
                  <i class="bi bi-github"></i> Code
                </a>
              </div>
            </div>
          </div>

          <div class="project-info">
            <h3 class="project-title">{{ project.title }}</h3>
            <p class="project-desc">{{ project.description }}</p>

            <div class="tech-stack">
              <span class="tech-badge" *ngFor="let tech of project.stack">{{ tech }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
