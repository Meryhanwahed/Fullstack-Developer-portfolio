<section id="contact" class="contact-section py-5">
  <div class="container">
    <div class="text-center mb-5">
      <h2 class="section-title">Get In <span class="highlight">Touch</span></h2>
      <p class="section-subtitle">Have a project in mind? Let's build something great together.</p>
    </div>

    <div class="row g-5">
      <div class="col-lg-5">
        <div class="contact-info-card">
          <h3>Contact Information</h3>
          <p class="mb-4">Feel free to reach out to me via email or follow me on social media.</p>

          <div class="info-item">
            <i class="bi bi-envelope-at-fill"></i>
            <span>contact@hesham.com</span>
          </div>

          <div class="social-box mt-5">
            <h4>Follow Me</h4>
            <div class="social-links">
              <a href="https://linkedin.com/in/heshamwazzer" target="_blank" class="social-link"><i class="bi bi-linkedin"></i></a>
              <a href="https://github.com/heshamwazzer" target="_blank" class="social-link"><i class="bi bi-github"></i></a>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <form (ngSubmit)="onSubmit()" #contactForm="ngForm" class="contact-form">
          <div class="row g-3">
            <div class="col-md-6">
              <input type="text" class="form-control custom-input" placeholder="Your Name" required name="name" [(ngModel)]="formData.name">
            </div>
            <div class="col-md-6">
              <input type="email" class="form-control custom-input" placeholder="Your Email" required name="email" [(ngModel)]="formData.email">
            </div>
            <div class="col-12">
              <textarea class="form-control custom-input" rows="5" placeholder="Your Message" required name="message" [(ngModel)]="formData.message"></textarea>
            </div>
            <div class="col-12 text-md-end">
              <button type="submit" class="btn btn-glow-submit">
                Send Message <i class="bi bi-send-fill ms-2"></i>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
